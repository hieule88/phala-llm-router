services:
  private-ai-gateway:
    image: docker.io/dstacktee/git-launcher@sha256:4437dce18ec713b0991d34bd926d324966b1a0b90fad485b8ddb3f4ed2af138b
    command: ["/etc/git-launcher/gateway.conf"]
    ports:
      - "8086:8086"
    configs:
      - source: gateway-pin
        target: /etc/git-launcher/gateway.conf
      - source: gateway-config
        target: /etc/private-ai-gateway/gateway.config.json
      - source: gateway-upstreams
        target: /etc/private-ai-gateway/upstreams.seed.json
    environment:
      PRIVATE_AI_GATEWAY_CONFIG_PATH: /etc/private-ai-gateway/gateway.config.json
      PRIVATE_AI_GATEWAY_CACHE_DIR: /var/lib/private-ai-gateway/cache
    volumes:
      - gateway-checkout:/var/lib/git-launcher
      - gateway-state:/var/lib/private-ai-gateway
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: unless-stopped

configs:
  gateway-pin:
    content: |
      REPO_URL=https://github.com/hieule88/phala-llm-router.git
      COMMIT_SHA=9d393a1609f11185d296506d22fce70a5ce01b18
      WORK_DIR=/var/lib/git-launcher/private-ai-gateway-router
  gateway-config:
    content: |
      {
        "bind": "0.0.0.0:8086",
        "state_dir": "/var/lib/private-ai-gateway",
        "upstream_config_seed_path": "/etc/private-ai-gateway/upstreams.seed.json",
        "admin_token": "${PRIVATE_AI_GATEWAY_ADMIN_TOKEN:?set PRIVATE_AI_GATEWAY_ADMIN_TOKEN}",
        "api_token": "${PRIVATE_AI_GATEWAY_API_TOKEN:?set PRIVATE_AI_GATEWAY_API_TOKEN}",
        "dstack_endpoint": "unix:/var/run/dstack.sock",
        "middleware": {
          "public_model": "${PRIVATE_AI_GATEWAY_PUBLIC_MODEL:?set PRIVATE_AI_GATEWAY_PUBLIC_MODEL}",
          "cache_threshold": 0.3,
          "balance_abs_threshold": 64,
          "balance_rel_threshold": 1.5,
          "max_history_per_route": 256,
          "metrics_poll_ms": 1000,
          "metrics_timeout_ms": 800,
          "metrics_stale_ms": 3000,
          "metrics_path": "/v1/metrics",
          "trusted_user_tier_header": false,
          "default_engine": "vllm",
          "default_system_prompt": "You are served through a confidential TEE inference service. Your training data has a cutoff date and you know nothing after it. For recent events or facts you cannot know, say so plainly instead of guessing - never fabricate URLs, citations, quotes, news, or dates. Only give a URL when you are confident it existed before your cutoff, and state your cutoff when asked about recent topics. If a web search tool is available, use it only when the user explicitly asks you to search or look something up online; when you search, never include confidential details from the conversation (names, codenames, personal or business plans) in the query - search only the generic public topic - and tell the user what query you searched. If the user asks you to search but no search tool is available, say you cannot browse the web."
        }
      }
  gateway-upstreams:
    content: |
      []

volumes:
  gateway-checkout:
  gateway-state:
