# Leviathan multi-tenant front: Edge + auth-service (credit ledger).
# The single-tenant AI gateway runs SEPARATELY on Phala; the Edge points at it
# via GATEWAY_URL and forwards with GATEWAY_API_TOKEN (the gateway's internal
# api_token). Put values in a .env next to this file.
name: leviathan-ai-edge

services:
  auth-service:
    build: ../auth-service
    container_name: leviathan-auth-service
    restart: always
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN (openssl rand -hex 32)}
      - PROXY_REFUND_TOKEN=${PROXY_REFUND_TOKEN:?set PROXY_REFUND_TOKEN (openssl rand -hex 32)}
      - AUTH_DB_PATH=/data/auth.db
      - ALLOW_EMPTY_DB=${ALLOW_EMPTY_DB:-}
      # Stripe (hosted checkout; test mode uses sk_test_/whsec_ keys).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-}
      # Stripe refuses charges below a per-currency floor. Sessions are
      # created in USD ($0.50), but the floor that applies is the one for
      # the ACCOUNT'S SETTLEMENT currency — raise this when settling in a
      # currency with a higher minimum (GBP 0.30, HUF 175, JPY 50, …).
      # Checked before the intent row is written, so a too-small purchase
      # costs the user nothing.
      - STRIPE_MIN_AMOUNT_CENTS=${STRIPE_MIN_AMOUNT_CENTS:-50}
      # On-chain rail (Miden/Leviathan wallet). Address/faucet are PUBLIC
      # values — the seed controlling the receiving account never goes here.
      # Empty ONCHAIN_WATCHER_TOKEN disables the receive side (503).
      - ONCHAIN_GATEWAY_ADDRESS=${ONCHAIN_GATEWAY_ADDRESS:-}
      - ONCHAIN_FAUCET_ID=${ONCHAIN_FAUCET_ID:-}
      - ONCHAIN_TOKEN_DECIMALS=${ONCHAIN_TOKEN_DECIMALS:-6}
      - ONCHAIN_CENTS_PER_TOKEN=${ONCHAIN_CENTS_PER_TOKEN:-100}
      - ONCHAIN_NETWORK=${ONCHAIN_NETWORK:-testnet}
      - ONCHAIN_WATCHER_TOKEN=${ONCHAIN_WATCHER_TOKEN:-}
      # On-chain intents live short (24h — a quote's price must not stay
      # payable for a month) and stay matchable only GRACE past the TTL,
      # so a late payment still finds its order.
      - ONCHAIN_INTENT_TTL_SECONDS=${ONCHAIN_INTENT_TTL_SECONDS:-86400}
      - ONCHAIN_MATCH_GRACE_SECONDS=${ONCHAIN_MATCH_GRACE_SECONDS:-172800}
      # Live unpaid intents allowed per identity, counted PER RAIL. The
      # budgets are separate on purpose: rail TTLs differ by 30x, so a
      # shared counter let abandoned card checkouts (30d) occupy every
      # slot and starve the on-chain rail (24h) for a month.
      - ONCHAIN_MAX_PENDING_PER_IDENTITY=${ONCHAIN_MAX_PENDING_PER_IDENTITY:-8}
      - INTENT_MAX_PENDING_PER_IDENTITY=${INTENT_MAX_PENDING_PER_IDENTITY:-16}
      # Server-built wallet payloads: the ledger asks note-builder (below)
      # for the serialized transaction a payer's wallet signs, so clients
      # need no Miden SDK. Empty URL = off (clients build their own note).
      - ONCHAIN_BUILDER_URL=${ONCHAIN_BUILDER_URL:-http://note-builder:8090}
      - ONCHAIN_BUILDER_TOKEN=${ONCHAIN_BUILDER_TOKEN:-}
      # Force every top-up onto one provider regardless of what clients ask
      # for (switch rails without redeploying any frontend). Empty = client picks.
      - TOPUP_PROVIDER_OVERRIDE=${TOPUP_PROVIDER_OVERRIDE:-}
    volumes:
      - auth_data:/data
    expose:
      - "8000"
    networks: [edge-net]

  # On-chain receive side: watches the Miden chain for P2ID payments to
  # the gateway account and reports them to auth-service. Holds NO key
  # material — it only observes and reports; crediting is bounded by the
  # server's own guards (dusted amount, one-note-one-intent, faucet).
  # Optional: without ONCHAIN_WATCHER_TOKEN the service is not started
  # usefully (auth-service answers 503) — scale it to 0 or leave the
  # token unset until the on-chain rail goes live.
  note-watcher:
    build:
      context: ./note-watcher
      # The private Gitea registry needs auth even for reads; the token
      # is a BUILD arg only (never an ENV in the image — see Dockerfile).
      args:
        GITEA_NPM_TOKEN: ${GITEA_NPM_TOKEN:-}
    container_name: leviathan-note-watcher
    restart: always
    environment:
      - AUTH_URL=http://auth-service:8000
      - ONCHAIN_WATCHER_TOKEN=${ONCHAIN_WATCHER_TOKEN:-}
      - NODE_RPC_URL=${MIDEN_NODE_RPC_URL:-http://178.63.134.75:57291}
      - POLL_INTERVAL_SEC=${WATCHER_POLL_INTERVAL_SEC:-10}
      - FINALITY_DEPTH=${WATCHER_FINALITY_DEPTH:-0}
      - SCAN_LOOKBACK_BLOCKS=${WATCHER_SCAN_LOOKBACK_BLOCKS:-100}
      - UNMATCHED_TTL_SECONDS=${WATCHER_UNMATCHED_TTL_SECONDS:-172800}
    volumes:
      - watcher_state:/state
    depends_on:
      - auth-service
    # The watcher is a PULL loop — nobody notices when it stops pulling
    # (Stripe pushes and retries; the chain does neither). Health =
    # heartbeat freshness (progress), not process liveness: a wedged
    # process goes unhealthy here first, then its in-process watchdog
    # (WATCHDOG_STALL_SECONDS) exits so `restart: always` replaces it.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [edge-net]

  # note-builder: the SAME image as note-watcher (same SDK build, same
  # memo codec module), run as a second process with an internal HTTP
  # front. auth-service calls it to build the wallet payload for an
  # on-chain intent (POST /build) and probes GET /health before it
  # commits such an intent. A separate process on purpose: the watcher
  # stays a pure pull loop and a build storm can never stall a scan.
  # No published ports — reachable only on edge-net.
  note-builder:
    build:
      context: ./note-watcher
      args:
        GITEA_NPM_TOKEN: ${GITEA_NPM_TOKEN:-}
    container_name: leviathan-note-builder
    restart: always
    command: ["node", "src/builder-server.mjs"]
    environment:
      - BUILDER_PORT=8090
      - BUILDER_TOKEN=${ONCHAIN_BUILDER_TOKEN:-}
    # /health is 503 until the SDK's WASM is loaded, so "up but not
    # ready" reads unhealthy — the same signal auth-service preflights on.
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [edge-net]

  edge:
    build: .
    container_name: leviathan-ai-edge
    restart: always
    environment:
      # Co-located with auth-service on the private network → http is fine.
      - AUTH_SERVICE_URL=http://auth-service:8000
      - AUTH_SERVICE_ALLOW_HTTP=true
      # MUST equal PROXY_REFUND_TOKEN above (gates /v1/consume + /v1/refund).
      - AUTH_SERVICE_PROXY_TOKEN=${PROXY_REFUND_TOKEN:?}
      # The Phala-hosted gateway + its internal service token (sent on
      # x-gateway-token; authorization carries the per-user tenant bearer).
      - GATEWAY_URL=${GATEWAY_URL:?set GATEWAY_URL (the Phala gateway base, no trailing slash)}
      - GATEWAY_API_TOKEN=${GATEWAY_API_TOKEN:?set GATEWAY_API_TOKEN (the gateway's api_token)}
      # Derives per-user tenant bearers (receipt ownership at the gateway).
      # Rotating it orphans receipts issued under the old bearers.
      - EDGE_TENANT_SECRET=${EDGE_TENANT_SECRET:?set EDGE_TENANT_SECRET (openssl rand -hex 32)}
    expose:
      - "8090"
    depends_on:
      - auth-service
    networks: [edge-net]

  # Public HTTPS front (Let's Encrypt via Caddy) for two DuckDNS names:
  #   AUTH_PUBLIC_DOMAIN — auth-service payment surface + Stripe webhook
  #   EDGE_PUBLIC_DOMAIN — the Edge (OpenAI-compatible API for end users)
  # Set both in .env; DNS records must point at this host first.
  caddy:
    image: caddy:2
    container_name: leviathan-caddy
    restart: always
    environment:
      - AUTH_PUBLIC_DOMAIN=${AUTH_PUBLIC_DOMAIN:?set AUTH_PUBLIC_DOMAIN (e.g. myauth.duckdns.org)}
      - EDGE_PUBLIC_DOMAIN=${EDGE_PUBLIC_DOMAIN:?set EDGE_PUBLIC_DOMAIN (e.g. myedge.duckdns.org)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - auth-service
      - edge
    networks: [edge-net]

networks:
  edge-net:
    driver: bridge

volumes:
  auth_data:
  caddy_data:
  # Note-watcher cursor + report bookkeeping. State, not cache: losing
  # it re-scans (harmless, the server dedups) but forgets dead-letters.
  watcher_state:
