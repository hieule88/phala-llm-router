# Leviathan multi-tenant front: Edge + auth-service (credit ledger).
# The single-tenant AI gateway runs SEPARATELY on Phala; the Edge points at it
# via GATEWAY_URL and forwards with GATEWAY_API_TOKEN (the gateway's internal
# api_token). Put values in a .env next to this file.
name: leviathan-ai-edge

services:
  auth-service:
    build: ../auth-service
    container_name: leviathan-auth-service
    restart: always
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN (openssl rand -hex 32)}
      - PROXY_REFUND_TOKEN=${PROXY_REFUND_TOKEN:?set PROXY_REFUND_TOKEN (openssl rand -hex 32)}
      - AUTH_DB_PATH=/data/auth.db
      - ALLOW_EMPTY_DB=${ALLOW_EMPTY_DB:-}
      # NOWPayments (top-ups). Empty disables the webhook (503).
      # For the sandbox set NOWPAYMENTS_API_BASE=https://api-sandbox.nowpayments.io/v1
      # (with a sandbox API key + sandbox IPN secret); default is production.
      - NOWPAYMENTS_IPN_SECRET=${NOWPAYMENTS_IPN_SECRET:-}
      - NOWPAYMENTS_API_KEY=${NOWPAYMENTS_API_KEY:-}
      - NOWPAYMENTS_IPN_CALLBACK_URL=${NOWPAYMENTS_IPN_CALLBACK_URL:-}
      - NOWPAYMENTS_API_BASE=${NOWPAYMENTS_API_BASE:-https://api.nowpayments.io/v1}
    volumes:
      - auth_data:/data
    expose:
      - "8000"
    networks: [edge-net]

  edge:
    build: .
    container_name: leviathan-ai-edge
    restart: always
    environment:
      # Co-located with auth-service on the private network → http is fine.
      - AUTH_SERVICE_URL=http://auth-service:8000
      - AUTH_SERVICE_ALLOW_HTTP=true
      # MUST equal PROXY_REFUND_TOKEN above (gates /v1/consume + /v1/refund).
      - AUTH_SERVICE_PROXY_TOKEN=${PROXY_REFUND_TOKEN:?}
      # The Phala-hosted gateway + its internal service token (sent on
      # x-gateway-token; authorization carries the per-user tenant bearer).
      - GATEWAY_URL=${GATEWAY_URL:?set GATEWAY_URL (the Phala gateway base, no trailing slash)}
      - GATEWAY_API_TOKEN=${GATEWAY_API_TOKEN:?set GATEWAY_API_TOKEN (the gateway's api_token)}
      # Derives per-user tenant bearers (receipt ownership at the gateway).
      # Rotating it orphans receipts issued under the old bearers.
      - EDGE_TENANT_SECRET=${EDGE_TENANT_SECRET:?set EDGE_TENANT_SECRET (openssl rand -hex 32)}
    ports:
      - "8090:8090"
    depends_on:
      - auth-service
    networks: [edge-net]

  # Public HTTPS front (Let's Encrypt via Caddy) for two DuckDNS names:
  #   AUTH_PUBLIC_DOMAIN — auth-service payment surface + NOWPayments IPN
  #   EDGE_PUBLIC_DOMAIN — the Edge (OpenAI-compatible API for end users)
  # Set both in .env; DNS records must point at this host first.
  caddy:
    image: caddy:2
    container_name: leviathan-caddy
    restart: always
    environment:
      - AUTH_PUBLIC_DOMAIN=${AUTH_PUBLIC_DOMAIN:?set AUTH_PUBLIC_DOMAIN (e.g. myauth.duckdns.org)}
      - EDGE_PUBLIC_DOMAIN=${EDGE_PUBLIC_DOMAIN:?set EDGE_PUBLIC_DOMAIN (e.g. myedge.duckdns.org)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - auth-service
      - edge
    networks: [edge-net]

networks:
  edge-net:
    driver: bridge

volumes:
  auth_data:
  caddy_data:
