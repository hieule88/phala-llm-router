[package]
name = "leviathan-wallet-verifier"
version = "0.1.0"
edition = "2021"
description = "Stateless Falcon-512 signature verifier for Leviathan wallet-bound ACI"
license = "Apache-2.0"

[[bin]]
name = "leviathan-wallet-verifier"
path = "src/main.rs"

[dependencies]
miden-crypto = { git = "https://git.softly.com/leviathan/crypto", branch = "v0.23.0", default-features = false, features = ["std"] }

axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unused_must_use = "deny"
